<html>
<head>
    <title>Sistema de Pagamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa">
        <h1> Sistema de Pagamentos</h1>

        <label for="nivel">Nível do Professor:</label>
        <select id="nivel">
            <option value="1">Nível 1 - R$12,00</option>
            <option value="2">Nível 2 - R$17,00</option>
            <option value="3">Nível 3 - R$25,00</option>
        </select>

        <label for="aulas">Quantidade de horas/aula por semana:</label>
        <input type="number" id="aulas" placeholder="Digite a quantidade de aulas">

        <button onclick="calcSal()">Calcular salário</button>

        <p id="res"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
